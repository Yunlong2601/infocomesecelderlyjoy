{% extends "base.html" %}

{% block title %}Access Denied - Community Connect{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-danger">
                <div class="card-body text-center">
                    <i class="fas fa-shield-alt fa-3x text-danger mb-3"></i>
                    <h2 class="card-title text-danger">Access Denied</h2>
                    <p class="card-text">You don't have permission to access this resource.</p>
                    <p class="text-muted">This attempt has been logged for security purposes.</p>
                    <div class="mt-4">
                        <a href="{{ url_for('main.index') }}" class="btn btn-primary">
                            <i class="fas fa-home"></i> Return Home
                        </a>
                        <a href="javascript:history.back()" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Go Back
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
