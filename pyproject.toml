[project]
name = "community-connect-elderly-joy"
version = "0.1.0"
description = "A secure Flask application for community connections"
requires-python = ">=3.11"
dependencies = [
    "email-validator>=2.2.0",
    "flask-login>=0.6.3",
    "flask>=3.1.1",
    "flask-sqlalchemy>=3.1.1",
    "gunicorn>=23.0.0",
    "psycopg2-binary>=2.9.10",
    "flask-wtf>=1.2.2",
    "wtforms>=3.2.1",
    "sqlalchemy>=2.0.42",
    "werkzeug>=3.1.3",
    "flask-mail>=0.10.0",
    "cryptography>=45.0.5",
    "beautifulsoup4>=4.13.4",
    "requests>=2.32.4",
    "python-dotenv>=1.1.1",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["*.py"]
exclude = ["static*", "templates*"]
